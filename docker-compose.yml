services:
  # ── Flask Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hamo_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env # create this from .env.example
    environment:
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    networks:
      - hamo_net

  # ── Frontend (Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hamo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hamo_net

networks:
  hamo_net:
    driver: bridge
