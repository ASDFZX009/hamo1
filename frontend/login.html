<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Hamo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --text: #e2e8f0;
      --muted: #64748b;
      --pink: #e040fb;
      --blue: #42a5f5;
      --green: #22c55e;
    }

    html,
    body {
      height: 100%;
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: #6c63ff;
      top: -150px;
      left: -150px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: #a78bfa;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: #38bdf8;
      top: 50%;
      left: 55%;
      animation-delay: -8s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(40px, 30px) scale(1.08);
      }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(19, 19, 26, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 0 1px rgba(108, 99, 255, 0.1), 0 32px 64px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.6s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.4);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .secure-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtext {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    /* ── Role selector ── */
    .role-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .role-tab {
      padding: 12px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: transparent;
      font-family: 'Kanit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .role-tab:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .role-tab.active-user {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(66, 165, 245, 0.08);
    }

    .role-tab.active-admin {
      border-color: var(--pink);
      color: var(--pink);
      background: rgba(224, 64, 251, 0.08);
    }

    /* ── Admin code box ── */
    .admin-code-wrap {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
      margin-bottom: 0;
    }

    .admin-code-wrap.show {
      max-height: 100px;
      opacity: 1;
      margin-bottom: 18px;
    }

    .admin-code-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .admin-code-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .admin-code-input::placeholder {
      letter-spacing: 1px;
      font-size: 13px;
      font-weight: 400;
    }

    .admin-code-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(224, 64, 251, 0.1);
    }

    .admin-code-input.error {
      border-color: #ef4444;
      animation: shake 0.4s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 12px;
      color: var(--muted);
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      color: #1f1f1f;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.18s, box-shadow 0.18s, transform 0.12s;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .btn-google:hover {
      background: #f1f5f9;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .google-logo {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(31, 31, 31, 0.3);
      border-top-color: #1f1f1f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-top: 16px;
    }

    .error-box.show {
      display: flex;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .footer a {
      color: var(--accent2);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">🧢</div>
        <span class="brand-name">Running event TalesRunNer</span>
      </div>

      <div class="secure-badge"><span class="dot"></span>Secured by Supabase Auth</div>

      <h1>Welcome!!!</h1>
      <p class="subtext">เลือกประเภทบัญชีแล้ว Sign in เพื่อเข้าใช้งาน</p>

      <!-- Role selector -->
      <div class="role-label">เข้าสู่ระบบในฐานะ</div>
      <div class="role-tabs">
        <button class="role-tab active-user" id="tabUser" onclick="selectRole('user')">
          👤 User
        </button>
        <button class="role-tab" id="tabAdmin" onclick="selectRole('admin')">
          🛡️ Admin
        </button>
      </div>

      <!-- Admin code -->
      <div class="admin-code-wrap" id="adminCodeWrap">
        <label class="admin-code-label">🔑 Admin Code</label>
        <input class="admin-code-input" id="adminCodeInput" type="password" placeholder="กรอก Admin Code" maxlength="10"
          oninput="validateAdminCode()" />
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text" id="dividerText">Continue as User</span>
        <div class="divider-line"></div>
      </div>

      <button class="btn-google" id="googleBtn" onclick="signInWithGoogle()" disabled>
        <svg class="google-logo" viewBox="0 0 24 24">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4" />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853" />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
            fill="#FBBC05" />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335" />
        </svg>
        <span id="btnText">Sign in with Google</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="error-box" id="errorBox">
        <span>⚠️</span><span id="errorText">Something went wrong.</span>
      </div>

      <div class="footer">
        By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const BACKEND = '';
    // ADMIN_CODE ถูกย้ายไป validate ที่ backend แล้ว (ไม่เก็บใน JS)
    let _supabase = null;
    let selectedRole = 'user';
    let adminCodeValid = false;

    // ── Boot ─────────────────────────────────────────────────────────
    (async () => {
      const btn = document.getElementById('googleBtn');
      const errBox = document.getElementById('errorBox');
      const errTxt = document.getElementById('errorText');
      try {
        const res = await fetch(`${BACKEND}/api/config`);
        const config = await res.json();
        if (!config.supabaseUrl || !config.supabaseKey) throw new Error('Config missing');
        _supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);

        _supabase.auth.onAuthStateChange((event, session) => {
          if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
            // Save role to sessionStorage before redirect
            sessionStorage.setItem('hamo_role', selectedRole);
            window.location.replace('./dashboard.html');
          }
        });

        const { data } = await _supabase.auth.getSession() || { data: null };
        const session = data?.session;
        if (session) { window.location.replace('./dashboard.html'); return; }

        updateUI();
      } catch (err) {
        errTxt.textContent = 'Cannot reach backend: ' + err.message;
        errBox.classList.add('show');
      }
    })();

    // ── Role selection ────────────────────────────────────────────────
    function selectRole(role) {
      selectedRole = role;
      const tabUser = document.getElementById('tabUser');
      const tabAdmin = document.getElementById('tabAdmin');
      const wrap = document.getElementById('adminCodeWrap');
      const input = document.getElementById('adminCodeInput');

      tabUser.className = 'role-tab' + (role === 'user' ? ' active-user' : '');
      tabAdmin.className = 'role-tab' + (role === 'admin' ? ' active-admin' : '');

      if (role === 'admin') {
        wrap.classList.add('show');
        input.focus();
        adminCodeValid = false;
      } else {
        wrap.classList.remove('show');
        input.value = '';
        input.classList.remove('error');
        adminCodeValid = true; // user doesn't need code
      }
      updateUI();
    }

    // ── Admin code validation ─────────────────────────────────────────
    async function validateAdminCode() {
      const input = document.getElementById('adminCodeInput');
      const val = input.value.trim();
      input.classList.remove('error');
      input.style.borderColor = '';
      input.style.boxShadow = '';
      adminCodeValid = false;

      if (val.length === 0) { updateUI(); return; }

      // ── ส่ง code ไป verify ที่ backend แทนการเปรียบเทียบใน JS ──
      try {
        const res = await fetch(`${BACKEND}/api/verify-admin-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: val }),
        });
        const result = await res.json();
        if (result.valid) {
          adminCodeValid = true;
          input.style.borderColor = '#22c55e';
          input.style.boxShadow = '0 0 0 3px rgba(34,197,94,0.15)';
        } else {
          adminCodeValid = false;
          input.classList.add('error');
          const errBox = document.getElementById('errorBox');
          document.getElementById('errorText').textContent = 'Admin Code ไม่ถูกต้อง กรุณาลองอีกครั้ง';
          errBox.classList.add('show');
          setTimeout(() => errBox.classList.remove('show'), 3000);
        }
      } catch {
        adminCodeValid = false;
      }
      updateUI();
    }

    // ── Update UI state ───────────────────────────────────────────────
    function updateUI() {
      const btn = document.getElementById('googleBtn');
      const text = document.getElementById('dividerText');
      const canLogin = _supabase && (selectedRole === 'user' || adminCodeValid);
      btn.disabled = !canLogin;
      text.textContent = selectedRole === 'admin' ? 'Continue as Admin' : 'Continue as User';
    }

    // ── Sign in ───────────────────────────────────────────────────────
    async function signInWithGoogle() {
      if (!_supabase) return;
      if (selectedRole === 'admin' && !adminCodeValid) {
        document.getElementById('errorText').textContent = 'กรุณากรอก Admin Code ให้ถูกต้องก่อน';
        document.getElementById('errorBox').classList.add('show');
        return;
      }

      const btn = document.getElementById('googleBtn');
      const text = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const errBox = document.getElementById('errorBox');

      btn.disabled = true; text.textContent = 'Redirecting…';
      spinner.style.display = 'block';
      errBox.classList.remove('show');

      sessionStorage.setItem('hamo_role', selectedRole);

      const currentUrl = window.location.href || '';
      const redirectTo = currentUrl.includes('login.html')
        ? currentUrl.replace('login.html', 'dashboard.html')
        : (currentUrl.endsWith('/') ? currentUrl + 'dashboard.html' : currentUrl + '/dashboard.html');

      const { error } = await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectTo },
      });

      if (error) {
        btn.disabled = false; text.textContent = 'Sign in with Google';
        spinner.style.display = 'none';
        document.getElementById('errorText').textContent = error.message;
        errBox.classList.add('show');
      }
    }

    // Init: user tab is default
    selectRole('user');
  </script>
</body>

</html>
