<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Management — Hamo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=Sarabun:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --card: #1a1a26;
      --border: rgba(255, 255, 255, 0.07);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.45);
      --pink: #e040fb;
      --pink2: #ce93d8;
      --blue: #42a5f5;
      --green: #69f0ae;
      --gold: #ffd54f;
      --red: #ef5350;
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'Kanit', 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* BG */
    .bg-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.07;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: #e040fb;
      top: -150px;
      left: -150px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: #42a5f5;
      bottom: -100px;
      right: -100px;
      animation-delay: -7s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(40px, 30px);
      }
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 14px;
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      border-color: var(--pink);
      color: var(--pink);
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .page-title span {
      color: var(--pink2);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--pink);
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--pink);
      overflow: hidden;
      box-shadow: 0 0 10px rgba(224, 64, 251, 0.3);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-logout {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 14px;
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* Main */
    main {
      position: relative;
      z-index: 1;
      max-width: 1300px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* Page heading */
    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .page-heading h1 span {
      background: linear-gradient(135deg, #fff 30%, var(--pink2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-heading p {
      font-size: 14px;
      color: var(--muted);
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    @media(max-width:640px) {
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
    }

    .stat-card.total::before {
      background: linear-gradient(90deg, var(--blue), var(--pink));
    }

    .stat-card.paid::before {
      background: var(--green);
    }

    .stat-card.pending::before {
      background: var(--gold);
    }

    .stat-card.failed::before {
      background: var(--red);
    }

    .stat-card-num {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    .stat-card.total .stat-card-num {
      color: var(--blue);
    }

    .stat-card.paid .stat-card-num {
      color: var(--green);
    }

    .stat-card.pending .stat-card-num {
      color: var(--gold);
    }

    .stat-card.failed .stat-card-num {
      color: var(--red);
    }

    .stat-card-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--blue);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Kanit', sans-serif;
      font-size: 14px;
      color: #fff;
      flex: 1;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }

    .filter-tab:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .filter-tab.active {
      border-color: var(--pink);
      color: var(--pink);
      background: rgba(224, 64, 251, 0.08);
    }

    .filter-tab.active-paid {
      border-color: var(--green);
      color: var(--green);
      background: rgba(105, 240, 174, 0.08);
    }

    .filter-tab.active-pending {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(255, 213, 79, 0.08);
    }

    /* Export btn */
    .btn-export {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 9px 18px;
      font-family: 'Kanit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-export:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Table container */
    .table-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .table-header-bar {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-title {
      font-size: 15px;
      font-weight: 700;
    }

    .table-count {
      font-size: 12px;
      color: var(--muted);
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      padding: 11px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.015);
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s;
      user-select: none;
    }

    thead th:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    thead th.sort-asc::after {
      content: ' ↑';
      color: var(--blue);
    }

    thead th.sort-desc::after {
      content: ' ↓';
      color: var(--blue);
    }

    tbody tr {
      transition: background 0.12s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.85);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .no-data {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Cells */
    .cell-num {
      color: var(--muted);
      font-size: 12px;
    }

    .cell-name {
      font-weight: 600;
    }

    .cell-email {
      color: var(--muted);
      font-size: 12px;
    }

    .cell-phone {
      font-size: 13px;
    }

    .shirt-badge {
      background: rgba(66, 165, 245, 0.1);
      border: 1px solid rgba(66, 165, 245, 0.2);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      display: inline-block;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-paid {
      background: rgba(105, 240, 174, 0.12);
      color: #69f0ae;
      border: 1px solid rgba(105, 240, 174, 0.25);
    }

    .status-pending {
      background: rgba(255, 213, 79, 0.12);
      color: #ffd54f;
      border: 1px solid rgba(255, 213, 79, 0.25);
    }

    .status-failed {
      background: rgba(239, 83, 80, 0.12);
      color: #ef5350;
      border: 1px solid rgba(239, 83, 80, 0.25);
    }

    .status-waiting {
      background: rgba(255, 213, 79, 0.12);
      color: #ffd54f;
      border: 1px solid rgba(255, 213, 79, 0.25);
    }

    /* Action buttons */
    .action-btn {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: 'Kanit', sans-serif;
      transition: all 0.15s;
      margin: 0 2px;
    }

    .action-btn-confirm {
      background: rgba(105, 240, 174, 0.15);
      color: #69f0ae;
      border: 1px solid rgba(105, 240, 174, 0.3);
    }

    .action-btn-confirm:hover {
      background: rgba(105, 240, 174, 0.25);
      transform: scale(1.05);
    }

    .action-btn-reject {
      background: rgba(239, 83, 80, 0.12);
      color: #ef5350;
      border: 1px solid rgba(239, 83, 80, 0.25);
    }

    .action-btn-reject:hover {
      background: rgba(239, 83, 80, 0.22);
      transform: scale(1.05);
    }

    .cell-date {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    /* Slip thumbnail */
    .slip-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.15s;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slip-thumb:hover {
      transform: scale(1.08);
    }

    .no-slip {
      color: var(--muted);
      font-size: 11px;
    }

    /* Slip lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      padding: 24px;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.8);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .lightbox.open .lightbox-img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.15s;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Auth overlay */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s;
    }

    .auth-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="spinner"></div>
  </div>

  <div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Slip Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-close" onclick="closeLightbox()">✕</div>
    <img class="lightbox-img" id="lightboxImg" src="" alt="slip" onclick="event.stopPropagation()" />
  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='./dashboard.html'">← กลับ</button>
      <div class="page-title">🗂️ Registration <span>Management</span></div>
    </div>
    <div class="header-right">
      <div class="avatar-wrap" id="avatarEl">?</div>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="page-heading">
      <h1><span>ข้อมูลผู้สมัคร</span></h1>
      <p>จัดการและตรวจสอบรายชื่อผู้สมัครทั้งหมด</p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card total">
        <div class="stat-card-num" id="sTotal">—</div>
        <div class="stat-card-label">👥 ทั้งหมด</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-card-num" id="sWaiting">—</div>
        <div class="stat-card-label">⏳ รอตรวจสอบ</div>
      </div>
      <div class="stat-card paid">
        <div class="stat-card-num" id="sPaid">—</div>
        <div class="stat-card-label">✅ ชำระแล้ว</div>
      </div>
      <div class="stat-card failed">
        <div class="stat-card-num" id="sFailed">—</div>
        <div class="stat-card-label">❌ ล้มเหลว</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <span style="color:var(--muted);">🔍</span>
        <input type="text" id="searchInput" placeholder="ค้นหา ชื่อ / อีเมล / เบอร์โทร..." oninput="filterTable()" />
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" id="tab-all" onclick="setFilter('all')">ทั้งหมด</button>
        <button class="filter-tab" id="tab-pending" onclick="setFilter('pending')">⏳ รอชำระ</button>
        <button class="filter-tab" id="tab-waiting" onclick="setFilter('waiting_verification')">🔍 รอตรวจสอบ</button>
        <button class="filter-tab" id="tab-paid" onclick="setFilter('paid')">✅ ชำระแล้ว</button>
        <button class="filter-tab" id="tab-failed" onclick="setFilter('failed')">❌ ปฏิเสธ</button>
      </div>
      <button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <div class="table-header-bar">
        <div class="table-title">รายชื่อผู้สมัคร</div>
        <div class="table-count" id="tableCount">กำลังโหลด...</div>
      </div>
      <div class="table-wrap">
        <table id="mainTable">
          <thead>
            <tr>
              <th onclick="sortTable('index')">#</th>
              <th onclick="sortTable('fullname')">ชื่อ-นามสกุล</th>
              <th onclick="sortTable('email')">อีเมล</th>
              <th onclick="sortTable('phone_number')">เบอร์โทร</th>
              <th onclick="sortTable('shirt_size')">ไซส์เสื้อ</th>
              <th onclick="sortTable('distance')">ระยะทาง</th>
              <th onclick="sortTable('payment_status')">สถานะการชำระเงิน</th>
              <th onclick="sortTable('created_at')">วันที่สมัคร</th>
              <th>สลิปโอนเงิน</th>
              <th>การจัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="10" class="no-data">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const BACKEND = '';
    let _supabase = null;
    function getRole() { return sessionStorage.getItem('hamo_role') || 'user'; }
    function apiHeaders() { return { 'Content-Type': 'application/json', 'X-Role': getRole() }; }
    let allUsers = [];
    let filtered = [];
    let currentFilter = 'all';
    let sortKey = 'created_at';
    let sortDir = 'desc';

    // ── Auth ──────────────────────────────────────────────────────────
    (async () => {
      try {
        const res = await fetch(`${BACKEND}/api/config`);
        const config = await res.json();
        _supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);
      } catch { window.location.replace('./login.html'); return; }

      const { data } = await _supabase.auth.getSession() || { data: null };
      const session = data?.session;
      if (!session) { window.location.replace('./login.html'); return; }

      // ── Guard: เฉพาะ admin เท่านั้น ──────────────────────────────
      if (getRole() !== 'admin') {
        alert('⛔ หน้านี้สำหรับ Admin เท่านั้น');
        window.location.replace('./dashboard.html');
        return;
      }

      const user = session.user;
      const displayName = user.user_metadata?.full_name || user.email || 'Admin';
      const avatarEl = document.getElementById('avatarEl');
      const avatarUrl = user.user_metadata?.avatar_url;
      if (avatarUrl) {
        avatarEl.innerHTML = `<img src="${avatarUrl}" alt="avatar" />`;
      } else {
        avatarEl.textContent = (displayName[0] || '?').toUpperCase();
      }

      document.getElementById('logoutBtn').onclick = async () => {
        await _supabase.auth.signOut();
        window.location.replace('./login.html');
      };

      await loadUsers();

      document.getElementById('authOverlay').classList.add('hidden');
      setTimeout(() => document.getElementById('authOverlay').remove(), 400);
    })();

    // ── Load users ────────────────────────────────────────────────────
    async function loadUsers() {
      try {
        const res = await fetch(`${BACKEND}/api/users`, { headers: apiHeaders() });
        if (res.status === 403) {
          alert('⛔ ไม่มีสิทธิ์เข้าถึงข้อมูล');
          window.location.replace('./login.html');
          return;
        }
        allUsers = await res.json();
        if (!Array.isArray(allUsers)) allUsers = [];
      } catch {
        allUsers = [];
      }
      updateStats();
      filterTable();
    }

    // ── Stats ─────────────────────────────────────────────────────────
    function updateStats() {
      const paid = allUsers.filter(u => u.payment_status === 'paid').length;
      const waiting = allUsers.filter(u => u.payment_status === 'waiting_verification').length;
      const pending = allUsers.filter(u => u.payment_status === 'pending').length;
      const failed = allUsers.filter(u => u.payment_status === 'failed').length;
      document.getElementById('sTotal').textContent = allUsers.length;
      document.getElementById('sWaiting').textContent = waiting + pending; // รวมรอชำระ + รอตรวจสอบ
      document.getElementById('sPaid').textContent = paid;
      document.getElementById('sFailed').textContent = failed;
    }

    // ── Filter ────────────────────────────────────────────────────────
    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.className = 'filter-tab';
      });
      let tabId = 'tab-' + f;
      if (f === 'waiting_verification') tabId = 'tab-waiting';
      const tab = document.getElementById(tabId);
      if (f === 'all') tab.classList.add('active');
      if (f === 'paid') tab.classList.add('active-paid');
      if (f === 'waiting_verification' || f === 'pending') tab.classList.add('active-pending');
      if (f === 'failed') tab.classList.add('active');
      filterTable();
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      filtered = allUsers.filter(u => {
        const matchStatus = currentFilter === 'all' || u.payment_status === currentFilter;
        const matchSearch = !q ||
          (u.fullname || '').toLowerCase().includes(q) ||
          (u.email || '').toLowerCase().includes(q) ||
          (u.phone_number || '').toLowerCase().includes(q) ||
          (u.distance || '').toLowerCase().includes(q);
        return matchStatus && matchSearch;
      });
      sortData();
      renderTable();
    }

    // ── Sort ──────────────────────────────────────────────────────────
    function sortTable(key) {
      if (sortKey === key) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortKey = key; sortDir = 'asc'; }
      document.querySelectorAll('thead th').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
      });
      const thIndex = ['index', 'fullname', 'email', 'phone_number', 'shirt_size', 'distance', 'payment_status', 'created_at'];
      const idx = thIndex.indexOf(key);
      if (idx >= 0) {
        const ths = document.querySelectorAll('thead th');
        ths[idx].classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
      sortData();
      renderTable();
    }

    function sortData() {
      filtered.sort((a, b) => {
        let av = a[sortKey] || '', bv = b[sortKey] || '';
        if (sortKey === 'index') { av = allUsers.indexOf(a); bv = allUsers.indexOf(b); }
        if (typeof av === 'string') av = av.toLowerCase();
        if (typeof bv === 'string') bv = bv.toLowerCase();
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    // ── Render ────────────────────────────────────────────────────────
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      document.getElementById('tableCount').textContent = `แสดง ${filtered.length} จาก ${allUsers.length} รายการ`;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="no-data">ไม่พบข้อมูล</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((u, i) => {
        const statusClass = u.payment_status === 'paid' ? 'status-paid' :
          u.payment_status === 'waiting_verification' ? 'status-pending' :
            u.payment_status === 'pending' ? 'status-pending' : 'status-failed';
        const statusIcon = u.payment_status === 'paid' ? '✅' :
          u.payment_status === 'waiting_verification' ? '🔍' :
            u.payment_status === 'pending' ? '⏳' : '❌';
        const statusLabel = u.payment_status === 'paid' ? 'ชำระแล้ว' :
          u.payment_status === 'waiting_verification' ? 'รอตรวจสอบสลิป' :
            u.payment_status === 'pending' ? 'รอชำระ' : 'ปฏิเสธ';
        const date = u.created_at
          ? new Date(u.created_at).toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' })
          : '—';
        const globalIdx = allUsers.indexOf(u) + 1;
        const slipHtml = u.slip_url
          ? `<img class="slip-thumb" src="${u.slip_url}" alt="slip" onclick="openLightbox('${u.slip_url}')" />`
          : `<span class="no-slip">—</span>`;

        // Distance badge
        const distanceClass = u.distance === '15KM' ? 'status-paid' : u.distance === '10KM' ? 'status-pending' : 'status-failed';
        const distanceLabel = u.distance || '5KM';

        // Action buttons for waiting_verification status (only show when slip is attached)
        let actionBtns = '—';
        if (u.payment_status === 'waiting_verification' && u.slip_url) {
          actionBtns = `
            <button class="action-btn action-btn-confirm" onclick="confirmPayment('${u.user_id}')">✅ ยืนยัน</button>
            <button class="action-btn action-btn-reject" onclick="rejectPayment('${u.user_id}')">❌ ปฏิเสธ</button>
          `;
        } else if (u.payment_status === 'waiting_verification' && !u.slip_url) {
          actionBtns = `<span style="color:#9e9e9e;font-size:11px;">ยังไม่แนบสลิป</span>`;
        } else if (u.payment_status === 'paid') {
          actionBtns = `<span style="color:#69f0ae;font-size:11px;">✓ ยืนยันแล้ว</span>`;
        } else if (u.payment_status === 'failed') {
          actionBtns = `<span style="color:#ef5350;font-size:11px;">✗ ปฏิเสธแล้ว</span>`;
        }

        return `<tr>
          <td class="cell-num">${globalIdx}</td>
          <td class="cell-name">${u.fullname || '—'}</td>
          <td class="cell-email">${u.email || '—'}</td>
          <td class="cell-phone">${u.phone_number || '—'}</td>
          <td><span class="shirt-badge">${u.shirt_size || '—'}</span></td>
          <td><span class="shirt-badge">${distanceLabel}</span></td>
          <td><span class="status-badge ${statusClass}">${statusIcon} ${statusLabel}</span></td>
          <td class="cell-date">${date}</td>
          <td>${slipHtml}</td>
          <td>${actionBtns}</td>
        </tr>`;
      }).join('');
    }

    // ── Confirm Payment (Admin) ─────────────────────────────────────────
    async function confirmPayment(userId) {
      if (!confirm('ยืนยันการชำระเงินของผู้สมัครนี้?')) return;
      try {
        const res = await fetch(`${BACKEND}/api/users/${userId}`, {
          method: 'PUT',
          headers: apiHeaders(),
          body: JSON.stringify({ payment_status: 'paid' })
        });
        if (res.ok) {
          alert('✅ ยืนยันการชำระเงินสำเร็จ!');
          await loadUsers();
        } else {
          const err = await res.json();
          alert('❌ เกิดข้อผิดพลาด: ' + (err.error || 'ไม่สามารถอัพเดทได้'));
        }
      } catch {
        alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ');
      }
    }

    // ── Reject Payment (Admin) ─────────────────────────────────────────
    async function rejectPayment(userId) {
      const reason = prompt('ระบุเหตุผลในการปฏิเสธ (ถ้ามี):');
      try {
        const res = await fetch(`${BACKEND}/api/users/${userId}`, {
          method: 'PUT',
          headers: apiHeaders(),
          body: JSON.stringify({ payment_status: 'failed' })
        });
        if (res.ok) {
          alert('❌ ปฏิเสธการชำระเงินแล้ว');
          await loadUsers();
        } else {
          const err = await res.json();
          alert('❌ เกิดข้อผิดพลาด: ' + (err.error || 'ไม่สามารถอัพเดทได้'));
        }
      } catch {
        alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ');
      }
    }

    // ── Lightbox ──────────────────────────────────────────────────────
    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Export CSV ────────────────────────────────────────────────────
    function exportCSV() {
      const headers = ['#', 'ชื่อ-นามสกุล', 'อีเมล', 'เบอร์โทร', 'ไซส์เสื้อ', 'ระยะทาง', 'สถานะ', 'วันที่สมัคร'];
      const rows = filtered.map((u, i) => [
        allUsers.indexOf(u) + 1,
        u.fullname || '',
        u.email || '',
        u.phone_number || '',
        u.shirt_size || '',
        u.distance || '',
        u.payment_status || '',
        u.created_at ? new Date(u.created_at).toLocaleDateString('th-TH') : '',
      ]);
      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `registrants_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
